name: Generate Datas

on:
  push:
    branches:
      - main
    paths:
      - "assets/embedded-systems-scope.svg"
      - ".github/workflows/cobra.yml"
  schedule: # execute every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  build:
    name: Jobs to update datas
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare embedded systems profile animation
        run: mkdir -p dist && cp assets/embedded-systems-scope.svg dist/embedded-systems-scope.svg

      # Snake Animation
      - uses: Platane/snk@master
        id: snake-gif
        with:
          github_user_name: imtavin
          gif_out_path: dist/github-contribution-grid-snake.gif
          svg_out_path: dist/github-contribution-grid-snake.svg

      - uses: crazy-max/ghaction-github-pages@v2.1.3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
