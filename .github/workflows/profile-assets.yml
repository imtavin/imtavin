name: Update profile assets

on:
  push:
    branches:
      - main
    paths:
      - "assets/binary-rain.gif"
      - "assets/embedded-systems-scope.svg"
      - "assets/oscilloscope-purple.gif"
      - ".github/workflows/profile-assets.yml"
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Generate profile assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare profile animations
        run: |
          mkdir -p dist
          cp assets/binary-rain.gif dist/binary-rain.gif
          cp assets/embedded-systems-scope.svg dist/embedded-systems-scope.svg
          cp assets/oscilloscope-purple.gif dist/oscilloscope-purple.gif

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: imtavin
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=purple
            dist/github-contribution-grid-snake.gif?color_snake=purple

      - name: Generate GitHub stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=imtavin&show_icons=true&hide_rank=true&include_all_commits=true&title_color=B778FF&text_color=C9B9D9&icon_color=ED8BE8&border_color=735A9B&bg_color=0A0C12"
          path: dist/github-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish profile assets
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
