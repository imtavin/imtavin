<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" fill="none">
  <title>Conceito visual para o perfil GitHub de Gustavo</title>
  <desc>Uma placa de bancada ilustrada com display de osciloscópio e quatro controles para explorar automação, hardware e sensores, software embarcado e validação.</desc>
  <defs>
    <linearGradient id="background" x1="90" y1="0" x2="1370" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101A21"/>
      <stop offset=".55" stop-color="#0C151B"/>
      <stop offset="1" stop-color="#101C20"/>
    </linearGradient>
    <linearGradient id="board" x1="85" y1="310" x2="1360" y2="770" gradientUnits="userSpaceOnUse">
      <stop stop-color="#183236"/>
      <stop offset=".52" stop-color="#13292D"/>
      <stop offset="1" stop-color="#102328"/>
    </linearGradient>
    <linearGradient id="screen" x1="130" y1="369" x2="850" y2="690" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101E24"/>
      <stop offset="1" stop-color="#091318"/>
    </linearGradient>
    <linearGradient id="trace" x1="240" y1="555" x2="810" y2="555" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFB65D"/>
      <stop offset=".48" stop-color="#F1D47F"/>
      <stop offset="1" stop-color="#67E4D5"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="matrix(490 0 0 320 720 475)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#20514D" stop-opacity=".34"/>
      <stop offset="1" stop-color="#101A21" stop-opacity="0"/>
    </radialGradient>
    <pattern id="background-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#91AAA4" stroke-opacity=".055"/>
    </pattern>
    <pattern id="scope-grid" width="62" height="48" patternUnits="userSpaceOnUse">
      <path d="M62 0H0V48" stroke="#7CDCCE" stroke-opacity=".15" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.5" fill="#8ADFD2" fill-opacity=".28"/>
    </pattern>
    <filter id="soft-shadow" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="signal-glow" x="-25%" y="-100%" width="150%" height="300%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="screen-clip"><rect x="150" y="391" width="708" height="261" rx="8"/></clipPath>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .mono { font-family: "Cascadia Code", Consolas, monospace; }
      .scope-sweep { stroke-dasharray: 9 13; animation: sweep 3.8s linear infinite; }
      .selected-pulse { animation: breathe 2.3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .button-face { transition: fill .18s ease, stroke .18s ease, filter .18s ease; }
      .control:hover .button-face { fill: #28504C; stroke: #7CE5D5; filter: url(#signal-glow); }
      .control:hover .button-core { fill: #FFE2A3; }
      @keyframes sweep { to { stroke-dashoffset: -88; } }
      @keyframes breathe { 50% { opacity: .52; transform: scale(.82); } }
      @media (prefers-reduced-motion: reduce) {
        .scope-sweep, .selected-pulse { animation: none; }
      }
    </style>
  </defs>

  <!-- Fundo de bancada -->
  <rect width="1440" height="900" fill="url(#background)"/>
  <rect width="1440" height="900" fill="url(#background-grid)"/>
  <ellipse cx="720" cy="492" rx="590" ry="350" fill="url(#halo)"/>
  <path d="M72 82H1368" stroke="#D8E5DC" stroke-opacity=".16"/>

  <!-- Cabeçalho -->
  <g>
    <rect x="72" y="38" width="27" height="27" rx="7" fill="#183B3B" stroke="#68DFD0" stroke-opacity=".72"/>
    <path d="M79 51.5h5l3-6 4 12 3-6h4" stroke="#70E3D2" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="112" y="51" fill="#F2F0E4" font-size="13" font-weight="700" letter-spacing="1.5">GUSTAVO TAVARES ESPENCHITT</text>
    <text x="112" y="67" fill="#94A8A5" font-size="9" letter-spacing="1.8" class="mono">COMPUTER ENGINEERING · EMBEDDED SYSTEMS</text>
    <text x="1367" y="54" text-anchor="end" fill="#91A7A5" font-size="11" letter-spacing="1.4" class="mono">CURITIBA, BR</text>
    <circle cx="1322" cy="50" r="3" fill="#6DE0D0"/>
  </g>

  <!-- Apresentação -->
  <text x="76" y="125" fill="#72E0D2" font-size="11" font-weight="600" letter-spacing="2.3" class="mono">SINAL DE CAMPO  <tspan fill="#758A89">/</tspan>  SISTEMA EMBARCADO</text>
  <text x="72" y="190" fill="#F4F0DF" font-size="57" font-weight="560" letter-spacing="-2.8">Do sinal de campo ao software</text>
  <text x="72" y="249" fill="#F4F0DF" font-size="57" font-weight="560" letter-spacing="-2.8">embarcado.</text>
  <text x="76" y="282" fill="#AAB8B4" font-size="15">Automação, eletrônica e software conectados a equipamentos reais.</text>
  <text x="1365" y="282" text-anchor="end" fill="#718783" font-size="10" letter-spacing="1.2" class="mono">INTERFACE CONCEITUAL · SINAIS ILUSTRATIVOS</text>

  <!-- Sombra da placa -->
  <path d="M116 344H1310L1368 402V704L1310 762H116L58 704V402L116 344Z" fill="#000" fill-opacity=".48" filter="url(#soft-shadow)"/>

  <!-- Placa principal com cantos chanfrados -->
  <path d="M112 322H1314L1380 388V704L1314 770H112L46 704V388L112 322Z" fill="url(#board)" stroke="#47706B" stroke-opacity=".78" stroke-width="1.5"/>
  <path d="M120 333H1308L1368 393V699L1308 759H120L58 699V393L120 333Z" stroke="#8BD9C8" stroke-opacity=".12"/>
  <path d="M112 344H1301L1358 401V691L1301 748H112L68 691V401L112 344Z" stroke="#0A171B" stroke-opacity=".65" stroke-width="2"/>

  <!-- Fixadores -->
  <g fill="#0C1B20" stroke="#76958C" stroke-opacity=".58">
    <circle cx="99" cy="376" r="10"/><circle cx="1327" cy="376" r="10"/>
    <circle cx="99" cy="716" r="10"/><circle cx="1327" cy="716" r="10"/>
  </g>
  <g stroke="#78948C" stroke-opacity=".62" stroke-width="1.3">
    <path d="m95 372 8 8m0-8-8 8M1323 372l8 8m0-8-8 8M95 712l8 8m0-8-8 8m1224-8 8 8m0-8-8 8"/>
  </g>

  <!-- Trilhas discretas da placa -->
  <g stroke="#53A99C" stroke-opacity=".35" stroke-width="2">
    <path d="M908 398h34v31h26"/><path d="M885 426h52v19h31"/>
    <path d="M878 655h52v-22h38"/><path d="M870 683h67v-19h30"/>
    <path d="M114 647h22v24h34"/><path d="M115 661h15v40h47"/>
  </g>
  <g fill="#6ED9C8" fill-opacity=".8">
    <circle cx="968" cy="429" r="3"/><circle cx="968" cy="445" r="3"/>
    <circle cx="968" cy="633" r="3"/><circle cx="968" cy="664" r="3"/>
    <circle cx="170" cy="671" r="3"/><circle cx="177" cy="701" r="3"/>
  </g>

  <!-- Display do osciloscópio -->
  <rect x="126" y="366" width="756" height="316" rx="16" fill="#0B171B" stroke="#5C827A" stroke-opacity=".62" stroke-width="1.5"/>
  <rect x="137" y="377" width="734" height="294" rx="10" fill="url(#screen)" stroke="#243F40"/>
  <text x="159" y="403" fill="#87A8A1" font-size="9" letter-spacing="1.6" class="mono">SIGNAL VIEW</text>
  <text x="849" y="403" text-anchor="end" fill="#6D9F94" font-size="9" letter-spacing="1.1" class="mono">DEMO / CHANNEL A</text>
  <g clip-path="url(#screen-clip)">
    <rect x="150" y="414" width="708" height="238" fill="url(#scope-grid)"/>
    <path d="M150 533H858M504 414V652" stroke="#A8D2C5" stroke-opacity=".18" stroke-dasharray="3 7"/>
    <path d="M166 548H226V480H287V548H349V480H410V548H472V480H533V548H595V480H656V548H718V480H779V548H846" stroke="#FFB65D" stroke-opacity=".25" stroke-width="10" stroke-linejoin="round" filter="url(#signal-glow)"/>
    <path d="M166 548H226V480H287V548H349V480H410V548H472V480H533V548H595V480H656V548H718V480H779V548H846" stroke="url(#trace)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M166 548H226V480H287V548H349V480H410V548H472V480H533V548H595V480H656V548H718V480H779V548H846" stroke="#FFF0C6" stroke-opacity=".75" stroke-width="1.2" stroke-linejoin="round" class="scope-sweep"/>
    <circle cx="533" cy="480" r="5" fill="#F8E5AA" class="selected-pulse"/>
  </g>
  <text x="160" y="662" fill="#718F88" font-size="8" letter-spacing="1" class="mono">INPUT SIGNAL</text>
  <text x="849" y="662" text-anchor="end" fill="#718F88" font-size="8" letter-spacing="1" class="mono">WAVEFORM ILUSTRATIVA</text>

  <!-- Moldura de controles -->
  <path d="M919 366H1301L1338 403V663L1301 700H919" stroke="#3E655F" stroke-opacity=".64" stroke-width="1.2"/>
  <text x="962" y="399" fill="#F1EEDF" font-size="13" font-weight="650" letter-spacing=".5">Explore a trajetória</text>
  <text x="962" y="418" fill="#78918B" font-size="9" letter-spacing="1.1" class="mono">SELECIONE UM CONTROLE</text>

  <!-- Controle 01: selecionado -->
  <g class="control" role="img" aria-label="Automação e integração: CLPs, redes industriais e sensores">
    <circle cx="984" cy="464" r="18" fill="#071317" stroke="#547C72" stroke-width="1.5"/>
    <circle cx="984" cy="464" r="12.5" fill="#1B3D3C" stroke="#82E1D0" stroke-opacity=".9" class="button-face"/>
    <circle cx="984" cy="464" r="4" fill="#FFC46D" class="button-core"/>
    <circle cx="984" cy="464" r="23" stroke="#73E2D2" stroke-opacity=".24" stroke-width="1" class="selected-pulse"/>
    <text x="1020" y="459" fill="#F4F0DF" font-size="13" font-weight="630">Automação e integração</text>
    <text x="1020" y="477" fill="#8DA49E" font-size="10">CLPs · redes industriais · sensores</text>
    <path d="M1020 491H1304" stroke="#6CD9C8" stroke-opacity=".35"/>
  </g>
  <!-- Controle 02 -->
  <g class="control" role="img" aria-label="Hardware e sensores: ESP32, Raspberry Pi e integração eletrônica">
    <circle cx="984" cy="525" r="18" fill="#071317" stroke="#547C72" stroke-width="1.5"/>
    <circle cx="984" cy="525" r="12.5" fill="#173238" stroke="#5C938B" class="button-face"/>
    <circle cx="984" cy="525" r="4" fill="#7A9C94" class="button-core"/>
    <text x="1020" y="520" fill="#D8E1D8" font-size="13" font-weight="600">Hardware e sensores</text>
    <text x="1020" y="538" fill="#8DA49E" font-size="10">ESP32 · Raspberry Pi · eletrônica</text>
    <path d="M1020 552H1304" stroke="#6CD9C8" stroke-opacity=".19"/>
  </g>
  <!-- Controle 03 -->
  <g class="control" role="img" aria-label="Software embarcado: Java, Linux e telemetria">
    <circle cx="984" cy="586" r="18" fill="#071317" stroke="#547C72" stroke-width="1.5"/>
    <circle cx="984" cy="586" r="12.5" fill="#173238" stroke="#5C938B" class="button-face"/>
    <circle cx="984" cy="586" r="4" fill="#7A9C94" class="button-core"/>
    <text x="1020" y="581" fill="#D8E1D8" font-size="13" font-weight="600">Software embarcado</text>
    <text x="1020" y="599" fill="#8DA49E" font-size="10">Java · Linux embarcado · telemetria</text>
    <path d="M1020 613H1304" stroke="#6CD9C8" stroke-opacity=".19"/>
  </g>
  <!-- Controle 04 -->
  <g class="control" role="img" aria-label="Testes e validação: cenários de campo e testes automatizados">
    <circle cx="984" cy="647" r="18" fill="#071317" stroke="#547C72" stroke-width="1.5"/>
    <circle cx="984" cy="647" r="12.5" fill="#173238" stroke="#5C938B" class="button-face"/>
    <circle cx="984" cy="647" r="4" fill="#7A9C94" class="button-core"/>
    <text x="1020" y="642" fill="#D8E1D8" font-size="13" font-weight="600">Testes e validação</text>
    <text x="1020" y="660" fill="#8DA49E" font-size="10">cenários de campo · testes automatizados</text>
  </g>

  <!-- Pequenos componentes da placa -->
  <g>
    <rect x="138" y="704" width="95" height="22" rx="4" fill="#102126" stroke="#4C716B"/>
    <path d="M149 709v12m10-12v12m10-12v12m10-12v12m10-12v12m10-12v12m10-12v12" stroke="#75A79D" stroke-opacity=".66" stroke-width="2"/>
    <text x="251" y="719" fill="#658982" font-size="8" letter-spacing="1.2" class="mono">I/O</text>
    <rect x="1192" y="704" width="78" height="22" rx="4" fill="#102126" stroke="#4C716B"/>
    <path d="M1203 709v12m10-12v12m10-12v12m10-12v12m10-12v12m10-12v12" stroke="#75A79D" stroke-opacity=".66" stroke-width="2"/>
    <text x="1280" y="719" fill="#658982" font-size="8" letter-spacing="1.2" class="mono">BUS</text>
  </g>

  <!-- Rodapé do conceito -->
  <text x="76" y="827" fill="#74DED0" font-size="10" letter-spacing="1.7" class="mono">01 — AUTOMAÇÃO &amp; INTEGRAÇÃO</text>
  <text x="76" y="855" fill="#D6DFD6" font-size="16">Uma trajetória entre sinais, dispositivos e software para sistemas reais.</text>
  <text x="1364" y="855" text-anchor="end" fill="#77908A" font-size="9" letter-spacing="1.2" class="mono">CONCEITO DE APRESENTAÇÃO · NÃO É UMA MEDIÇÃO REAL</text>
</svg>
